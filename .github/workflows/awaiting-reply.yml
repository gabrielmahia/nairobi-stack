name: Awaiting reply

# Two collaboration offers sat unanswered for 100+ days because they arrived by
# email through a forward that had been dead since 2023. This detector routes
# around email entirely: it asks GitHub directly whether a human is waiting.
on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC, alongside the portfolio audit
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Detect threads awaiting a reply
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: gabrielmahia
        run: python scripts/awaiting_reply.py
        continue-on-error: true    # someone waiting is a finding, not a build failure

      - name: Open or update the waiting-list issue
        if: steps.detect.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Someone is waiting on a reply"
          body="$(cat awaiting_report.md)"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Nobody waiting
        if: steps.detect.outcome == 'success'
        run: echo "No outstanding replies." >> "$GITHUB_STEP_SUMMARY"
