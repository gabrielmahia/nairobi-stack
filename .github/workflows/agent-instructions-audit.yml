name: Agent instructions audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit portfolio agent surfaces
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/audit_agent_instructions.py \
            --owner gabrielmahia \
            --output /tmp/agent-instructions-report.md

      - name: Publish report to workflow summary
        run: cat /tmp/agent-instructions-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Maintain one tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="AI agent instruction compliance"
          BODY="$(cat /tmp/agent-instructions-report.md)"
          # The search index lags behind new issues, so listing open issues directly is what keeps this to ONE issue; the oldest exact match wins.
          NUMBER="$(gh issue list --state open --limit 200 --json number,title --jq '[.[] | select(.title == "AI agent instruction compliance") | .number] | min // empty')"
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
